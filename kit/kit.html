<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BrandSim — UI-кит</title>
    <!-- пустой фавикон: иначе браузер просит /favicon.ico и пишет 404 в консоль,
         а консоль здесь — рабочий инструмент, в ней не должно быть шума -->
    <link rel="icon" href="data:,">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Rubik:wght@400;500;600;700&display=swap">
    <!-- styles.css — те же стили, что у экранов продукта: кит рисует
         настоящие компоненты, а не их копию -->
    <link rel="stylesheet" href="styles.css?v=92">
    <link rel="stylesheet" href="kit.css?v=51">
  </head>
  <body class="k-body">
    <header class="k-top">
      <h1>BrandSim UI</h1>
    </header>

    <div class="k-shell">
      <nav class="k-rail" id="rail" aria-label="Разделы кита"></nav>
      <main class="k-main" id="kitMain"></main>
    </div>

    <!-- ui.js на импорте вешает обработчики на #modal; #toast нужен toast().
         Продуктовые узлы, а не часть кита: без них helpTip() не импортировать,
         а тултип — одно из главных расхождений, и показывать его подделкой
         вместо настоящей функции было бы ровно тем враньём, против которого
         кит и делается. -->
    <div class="modal" id="modal" hidden></div>
    <div class="toast" id="toast" hidden></div>

    <script type="module" src="kit.js?v=60"></script>
  </body>
</html>
